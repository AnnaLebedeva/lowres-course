name: Inventory tests
on:
  push:
    paths:
      - 'scripts/inventory/**'
      - 'scripts/run_dataset_inventory.py'
      - 'scripts/authorize_inventory_drive.py'
      - 'tests/test_inventory.py'
      - 'requirements-inventory.txt'
      - '.github/workflows/*inventory*.yml'
  pull_request:
    paths:
      - 'scripts/inventory/**'
      - 'scripts/run_dataset_inventory.py'
      - 'scripts/authorize_inventory_drive.py'
      - 'tests/test_inventory.py'
      - 'requirements-inventory.txt'
      - '.github/workflows/*inventory*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-inventory.txt
      - run: pip install -r requirements-inventory.txt
      - run: python -m unittest discover -s tests -v
