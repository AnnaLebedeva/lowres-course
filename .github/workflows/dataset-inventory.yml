name: Dataset inventory

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'discover — обновить каталоги; review — проверить очередь; summary — пересобрать сводку'
        type: choice
        options: [review, discover, summary]
        default: review
      max_requests:
        description: 'Максимум запросов OpenRouter, включая повторы (0–20)'
        type: choice
        options: ['0', '1', '5', '10', '20']
        default: '20'
  schedule:
    - cron: '17 6 * * *'  # Ежедневно 09:17 МСК: review.
    - cron: '17 4 * * 1'  # Понедельник 07:17 МСК: discover.

permissions:
  contents: read

concurrency:
  group: dataset-inventory-drive
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GOOGLE_DRIVE_TOKEN_JSON: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID }}
      INVENTORY_ENABLED: ${{ vars.INVENTORY_ENABLED }}
      RUN_MODE: ${{ inputs.mode || (github.event.schedule == '17 4 * * 1' && 'discover' || 'review') }}
      MAX_REQUESTS: ${{ inputs.max_requests || '20' }}
    steps:
      - name: Проверить настройку
        id: config
        shell: bash
        run: |
          if [[ "$INVENTORY_ENABLED" != "true" ]]; then
            echo 'Автопрогон выключен. Выполните docs/dataset-inventory-actions.md и задайте INVENTORY_ENABLED=true.' >> "$GITHUB_STEP_SUMMARY"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          elif [[ -z "$GOOGLE_DRIVE_TOKEN_JSON" || -z "$GOOGLE_DRIVE_FOLDER_ID" ]]; then
            echo 'Не настроен доступ Google Drive.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          elif [[ "$RUN_MODE" == 'review' && "$MAX_REQUESTS" != '0' && -z "$OPENROUTER_API_KEY" ]]; then
            echo 'Не задан секрет OPENROUTER_API_KEY.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.config.outputs.ready == 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-inventory.txt
      - name: Установить зависимости
        if: steps.config.outputs.ready == 'true'
        run: pip install -r requirements-inventory.txt
      - name: Выполнить этап и сохранить результаты на Drive
        if: steps.config.outputs.ready == 'true'
        run: python scripts/run_dataset_inventory.py "$RUN_MODE" --drive --max-requests "$MAX_REQUESTS"
